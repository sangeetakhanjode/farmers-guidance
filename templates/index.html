<!DOCTYPE html>
<html>
<head>
    <title>Farmer Guidance AI</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f7f9;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .answer-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-left: 5px solid green;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌾 Farmer Guidance AI</h1>

    <form method="POST">
        <input type="text" name="question" placeholder="Ask your farming question" required>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <div class="answer-box">
            <h3>AI Response:</h3>
            <p>{{ answer|safe }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
